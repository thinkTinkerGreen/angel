# FILE: ci.yml | MODULE: ci | PURPOSE: Run repo checks and Gradle build/tests on every push. UNVERIFIED until first run.
name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python tools/check_headers.py
      - run: python tools/gen_context_map.py
  build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test assembleRelease
      - run: python3 tools/check_size.py $(find app/build/outputs -name '*.apk' | head -1)
