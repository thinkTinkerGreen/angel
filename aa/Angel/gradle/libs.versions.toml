# Versions checked against developer.android.com / kotlinlang.org release pages on 2026-11-10 (see docs/DECISIONS.md).
# Combination is NOT yet proven by a real build: the first CI run (task F-04) is the proof.
[versions]
agp = "8.13.2"        # AGP 8.13.x: Gradle 8.13, JDK 17, build-tools 35, supports API 36.1
kotlin = "2.3.20"     # stable (2026-03-16); AGP 8.13.2 notes Kotlin 2.3 support. Kotlin 2.4.x also exists
# Compose is not used by the first APK. Verified for F-10: compose.ui 1.12.1, compose.material3 1.4.0 (stable, 2026-11-04)
composeUi = "1.12.1"
composeMaterial3 = "1.4.0"
[libraries]
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
